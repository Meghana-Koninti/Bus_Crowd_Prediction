<!DOCTYPE html>
<html>
<head>
    <title>Signup - Smart Transit</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            display: flex;
            height: 100vh;
        }

        .left {
            width: 40%;
            background: 
                linear-gradient(rgba(15,23,42,0.8), rgba(15,23,42,0.9)),
                url('https://plus.unsplash.com/premium_photo-1664302152991-d013ff125f3f?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8Y2l0eSUyMGJ1c3xlbnwwfHwwfHx8MA%3D%3D');

            background-size: cover;
            background-position: center;

            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
        }

        .left h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .left p {
            color: #94a3b8;
        }

        .right {
            width: 60%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
            color: #1e293b;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #cbd5f5;
            outline: none;
        }

        input:focus {
            border-color: #22c55e;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }

        .link {
            margin-top: 15px;
            text-align: center;
        }

        .link a {
            color: #2563eb;
            text-decoration: none;
        }

        /* ✅ Added for error messages */
        .flash {
            color: red;
            margin-bottom: 10px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="left">
    <h1>Smart Transit</h1>
    <p>Create your account to access predictions</p>
</div>

<div class="right">
    <div class="card">
        <h2>Signup</h2>

        <!-- ✅ Flash messages -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for msg in messages %}
              <div class="flash">{{ msg }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>

            <!-- 🔥 NEW FIELD -->
            <input type="email" name="email" placeholder="Email" required>

            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Create Account</button>
        </form>

        <div class="link">
            <a href="/login">Already have an account?</a>
        </div>
    </div>
</div>

</body>
</html>
