<!DOCTYPE html>
<html>
<head>
    <title>Login - Smart Transit</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            display: flex;
            height: 100vh;
        }

        /* LEFT SIDE (Brand Panel) */
        .left {
    width: 40%;
    background: 
        linear-gradient(rgba(15,23,42,0.8), rgba(15,23,42,0.9)),
        url('https://plus.unsplash.com/premium_photo-1664302152991-d013ff125f3f?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8Y2l0eSUyMGJ1c3xlbnwwfHwwfHx8MA%3D%3D');

    background-size: cover;
    background-position: center;

    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px;
}

        .left h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .left p {
            color: #94a3b8;
        }

        /* RIGHT SIDE (Form) */
        .right {
            width: 60%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
            color: #1e293b;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #cbd5f5;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #334155;
        }

        .link {
            margin-top: 15px;
            text-align: center;
        }

        .link a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="left">
    <h1>Smart Transit</h1>
    <p>Hyderabad TSRTC Crowd Prediction System</p>
</div>

<div class="right">
    <div class="card">
        <h2>Login</h2>

        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <div class="link">
            <a href="/signup">Create new account</a>
        </div>
    </div>
</div>

</body>
</html>
